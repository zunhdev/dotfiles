[mgr]
marker_copied = { fg = "#87A987", bg = "#87A987" }
marker_cut = { fg = "#E46876", bg = "#E46876" }
marker_marked = { fg = "#938AA9", bg = "#938AA9" }
marker_selected = { fg = "#B98D7B", bg = "#B98D7B" }
cwd = { fg = "#E6C384" }
hovered = { reversed = true }
preview_hovered = { reversed = true }
find_keyword = { fg = "#B98D7B", bg = "#22262D" }
find_position = {}
count_copied = { fg = "#22262D", bg = "#87A987" }
count_cut = { fg = "#22262D", bg = "#E46876" }
count_selected = { fg = "#22262D", bg = "#E6C384" }
border_symbol = "│"
border_style = { fg = "#C5C9C7" }

[tabs]
active = { reversed = true }
inactive = {}

[mode]
normal_main = { fg = "#22262D", bg = "#8BA4B0" }
normal_alt = { fg = "#8BA4B0", bg = "#22262D" }
select_main = { fg = "#22262D", bg = "#957FB8" }
select_alt = { fg = "#957FB8", bg = "#22262D" }
unset_main = { fg = "#22262D", bg = "#E6C384" }
unset_alt = { fg = "#E6C384", bg = "#22262D" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#C5C9C7", bg = "#22262D" }
progress_label = { fg = "#8BA4B0", bg = "#22262D", bold = true }
progress_normal = { fg = "#22262D", bg = "#22262D" }
progress_error = { fg = "#22262D", bg = "#22262D" }
perm_type = { fg = "#87A987" }
perm_read = { fg = "#E6C384" }
perm_write = { fg = "#E46876" }
perm_exec = { fg = "#7AA89F" }
perm_sep = { fg = "#938AA9" }

[pick]
border = { fg = "#7FB4CA" }
active = { fg = "#938AA9", bold = true }
inactive = {}
[input]
border = { fg = "#7FB4CA" }
title = {}
value = {}
selected = { reversed = true }
[cmp]
border = { fg = "#7FB4CA" }
active = { reversed = true }
inactive = {}
[tasks]
border = { fg = "#7FB4CA" }
title = {}
hovered = { fg = "#938AA9" }
[which]
cols = 2
separator = " - "
separator_style = { fg = "#A4A7A4" }
mask = { bg = "#22262D" }
rest = { fg = "#A4A7A4" }
cand = { fg = "#8EA4A2" }
desc = { fg = "#C5C9C7" }
[help]
on = { fg = "#7AA89F" }
run = { fg = "#938AA9" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#22262D", bg = "#C5C9C7" }
[notify]
title_info = { fg = "#87A987" }
title_warn = { fg = "#E6C384" }
title_error = { fg = "#E46876" }
[filetype]
rules = [
  { mime = "image/*", fg = "#E6C384" },
  { mime = "{audio,video}/*", fg = "#938AA9" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E46876" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#A292A3" },
  { url = "*", is = "orphan", fg = "#E46876" },
  { url = "*", is = "exec", fg = "#7AA89F" },
  { url = "*", fg = "#C5C9C7" },
  { url = "*/", fg = "#8BA4B0" },
]
